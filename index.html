<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LovelyRes - Linux Emergency Response Tool</title>
  <!-- Highlight.js for syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <meta name="description" content="Linux应急响应工具，支持SSH连接、终端操作、文件管理和Docker容器管理" />
  <!-- Modern Typography: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* 防止页面闪烁的基础样式 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-primary, #0f172a);
      color: var(--text-primary, #e2e8f0);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #app {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Loading Screen — follows theme via CSS variables with dark fallbacks */
    .loading-screen {
      position: fixed;
      inset: 0;
      background: var(--bg-primary, #0f172a);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
    }
    .loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: lsFadeIn 0.6s ease-out;
    }

    /* Spinner ring */
    .logo-container {
      position: relative;
      width: 48px;
      height: 48px;
    }
    .logo-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border-width: 2.5px;
      border-style: solid;
      border-color: var(--border-color, rgba(255,255,255,0.1)) var(--border-color, rgba(255,255,255,0.1)) var(--border-color, rgba(255,255,255,0.1)) var(--primary-color, #4299e1);
      animation: lsSpin 0.9s linear infinite;
    }
    .logo-circle { display: none; }

    .app-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary, #f1f5f9);
      opacity: 0;
      animation: lsSlideUp 0.6s ease-out 0.15s forwards;
    }

    /* Progress bar */
    .loading-bar-container {
      width: 160px;
      height: 3px;
      background: var(--bg-tertiary, rgba(255,255,255,0.08));
      border-radius: 2px;
      overflow: hidden;
      opacity: 0;
      animation: lsFadeIn 0.6s ease-out 0.3s forwards;
    }
    .loading-bar {
      width: 100%;
      height: 100%;
      background: var(--primary-color, #4299e1);
      transform-origin: left;
      animation: lsProgress 2s ease-in-out infinite;
    }

    .loading-text {
      color: var(--text-secondary, #94a3b8);
      font-size: 12px;
      font-weight: 500;
      opacity: 0;
      animation: lsFadeIn 0.6s ease-out 0.4s forwards;
    }

    @keyframes lsSpin   { to { transform: rotate(360deg); } }
    @keyframes lsFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes lsSlideUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes lsProgress {
      0%   { transform: scaleX(0); }
      50%  { transform: scaleX(0.7); }
      100% { transform: scaleX(1); transform-origin: right; }
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <!-- 初始加载屏幕 -->
  <div id="loading-screen" class="loading-screen">
    <div class="loading-content">
      <div class="logo-container">
        <div class="logo-ring"></div>
        <div class="logo-circle"></div>
      </div>
      <div class="app-title">LovelyRes</div>
      <div class="loading-bar-container">
        <div class="loading-bar"></div>
      </div>
      <div class="loading-text">正在初始化系统...</div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
